nname: Build Spellcraft 1.20.1

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Mod
        run: |
          if [ -d "spellcraft" ]; then cd spellcraft; fi
          gradle build -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spellcraft-1.20.1
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-dev.jar
